name: Android APK Release

on:
  workflow_dispatch:
    inputs:
      release_name:
        description: "Release name"
        required: true
        type: string

      release_tag:
        description: "Release tag (example: v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: windows-latest

    steps:
      # Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Install Java 21
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Setup Android SDK (no deprecated tools package)
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # Install required Android SDK versions
      - name: Install Android SDK Packages
        shell: pwsh
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      # Gradle caching
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Validate release tag
      - name: Validate Release Tag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RELEASE_TAG)) {
            throw "Release tag cannot be empty."
          }

          git check-ref-format "refs/tags/$env:RELEASE_TAG"

          if ($LASTEXITCODE -ne 0) {
            throw "Invalid Git tag: $env:RELEASE_TAG"
          }

      # Build APKs
      - name: Build Debug and Release APKs
        shell: pwsh
        run: |
          .\gradlew.bat --no-daemon clean assembleDebug assembleRelease

      # Prepare release assets
      - name: Prepare APK Files
        shell: pwsh
        run: |
          $output = "release-assets"
          New-Item -ItemType Directory -Force -Path $output | Out-Null

          $debugApk = Get-ChildItem `
            "app\build\outputs\apk\debug" `
            -Filter "*.apk" -File |
            Select-Object -First 1

          $releaseApk = Get-ChildItem `
            "app\build\outputs\apk\release" `
            -Filter "*.apk" -File |
            Select-Object -First 1

          if (-not $debugApk) {
            throw "Debug APK was not generated!"
          }

          if (-not $releaseApk) {
            throw "Release APK was not generated!"
          }

          Copy-Item $debugApk.FullName "$output\ReyaanshsStuff-debug.apk"
          Copy-Item $releaseApk.FullName "$output\ReyaanshsStuff-release.apk"

          Get-ChildItem $output

      # Upload build artifacts
      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ReyaanshsStuff-Android-APKs
          path: release-assets/*.apk
          if-no-files-found: error

      # Publish GitHub Release
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: ${{ inputs.release_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: release-assets/*.apk
          fail_on_unmatched_files: true
