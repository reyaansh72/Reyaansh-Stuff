name: Build and Release

on:
  workflow_dispatch:
    inputs:
      release_name:
        description: "Release name (e.g. Reyaansh's Stuff v2.0)"
        required: true
        type: string

      release_tag:
        description: "Git tag (e.g. v2.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build Android App
    runs-on: windows-latest

    steps:
      # Checkout repository
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Configure Java
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Configure Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: pwsh
        run: |
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;36.0.0"

      # Validate release tag
      - name: Validate release information
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^[A-Za-z0-9][A-Za-z0-9._/-]*$') {
            throw "Invalid release tag."
          }

          if ($env:RELEASE_TAG -match '\.\.|/$') {
            throw "Invalid release tag."
          }

      # Build APK
      - name: Build Release APK
        shell: pwsh
        run: |
          .\gradlew.bat --no-daemon clean assembleRelease

      # Verify output
      - name: Check APK
        shell: pwsh
        run: |
          $apk = Get-ChildItem `
            -Path "app\build\outputs\apk\release" `
            -Filter "*.apk" `
            -File

          if (-not $apk) {
            throw "No APK found!"
          }

          Write-Host "Generated APKs:"
          $apk | ForEach-Object {
            Write-Host "$($_.Name) - $([math]::Round($_.Length / 1MB, 2)) MB"
          }

      # Upload APK as workflow artifact
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Reyaansh-Stuff-${{ inputs.release_tag }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      # Publish GitHub Release
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: ${{ inputs.release_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: app/build/outputs/apk/release/*.apk
